components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vcard:
          type: string
          format: uuid
          readOnly: true
        service:
          type: string
          format: uuid
        customer_name:
          type: string
          maxLength: 255
        customer_email:
          type: string
          format: email
          maxLength: 254
        customer_phone:
          type: string
          maxLength: 32
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
          readOnly: true
        status:
          $ref: '#/components/schemas/Status28fEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_email
      - customer_name
      - date
      - end_time
      - id
      - service
      - start_time
      - vcard
    AppointmentService:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vcard:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        duration_minutes:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          maxLength: 3
        is_active:
          type: boolean
      required:
      - id
      - name
      - vcard
    AppointmentStatusUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status28fEnum'
        notes:
          type: string
    AvailabilityRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vcard:
          type: string
          format: uuid
          readOnly: true
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: -2147483648
          maximum: 2147483647
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        timezone:
          type: string
          maxLength: 64
      required:
      - end_time
      - id
      - start_time
      - vcard
      - weekday
    AvailabilitySlot:
      type: object
      properties:
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - start_time
    AvailabilitySlotsResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
      required:
      - slots
    CardTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        preview_image:
          type: string
          format: uri
          readOnly: true
          nullable: true
        category:
          type: string
          readOnly: true
        configuration:
          readOnly: true
        is_premium:
          type: boolean
          readOnly: true
      required:
      - category
      - configuration
      - id
      - is_premium
      - name
      - preview_image
      - slug
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    Checkout:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/CheckoutProviderEnum'
        organization_id:
          type: string
          format: uuid
          nullable: true
      required:
      - plan_id
      - provider
    CheckoutProviderEnum:
      enum:
      - stripe
      - mpesa
      - sasapay
      type: string
      description: |-
        * `stripe` - stripe
        * `mpesa` - mpesa
        * `sasapay` - sasapay
    CheckoutResult:
      type: object
      properties:
        redirect_url:
          type: string
          nullable: true
        provider_reference:
          type: string
      required:
      - provider_reference
      - redirect_url
    ComponentHealth:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/RedisEnum'
        redis:
          $ref: '#/components/schemas/RedisEnum'
    CustomTokenObtainPair:
      type: object
      description: |-
        Adds basic user info to the token response so the frontend doesn't
        need a second round-trip to /auth/me/ immediately after login.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DetailMessage:
      type: object
      description: |-
        Generic {"detail": "..."} response shape used by several plain
        APIViews across the project — documented once here for OpenAPI/Postman.
      properties:
        detail:
          type: string
      required:
      - detail
