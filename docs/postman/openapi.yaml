openapi: 3.0.3
info:
  title: Digital Business Card SaaS API
  version: 1.0.0
  description: API for the digital business card / NFC identity platform.
paths:
  /api/public/cards/{slug}/:
    get:
      operationId: api_public_cards_retrieve
      description: |-
        JSON counterpart of the same public data (§39) for API/mobile
        consumers — never exposes private analytics/billing/internal org info.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VCardPublic'
          description: ''
  /api/public/cards/{slug}/analytics/:
    get:
      operationId: api_public_cards_analytics_retrieve
      description: |-
        Only a small, non-identifying aggregate — never referrer/device/
        country breakdowns or raw events (§25, §39).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicVCardAnalytics'
          description: ''
  /api/v1/analytics/:
    get:
      operationId: api_v1_analytics_retrieve
      description: GET /api/v1/analytics/?vcard=<id>&period=7d|30d|90d|12m|today|custom&start&end
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Required when period=custom
      - in: query
        name: period
        schema:
          type: string
        description: today|7d|30d|90d|12m|custom
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Required when period=custom
      - in: query
        name: vcard
        schema:
          type: string
          format: uuid
        description: VCard id (required)
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/appointments/:
    get:
      operationId: api_v1_appointments_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
