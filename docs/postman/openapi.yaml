          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentStatusUpdate'
          description: ''
    delete:
      operationId: api_v1_appointments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
